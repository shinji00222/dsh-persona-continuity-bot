name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (use latest for default install)"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - preview

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Validate syntax & unit tests
        run: |
          npm run check
          npm test

      - name: Publish with OIDC Provenance
        run: |
          TAG="${{ inputs.dist_tag || 'latest' }}"
          npm publish --provenance --access public --tag "$TAG"
